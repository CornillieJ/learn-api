<body class="bg-wt-bg">
<div id="root"></div>
<script type="module">
import { createHighlighter } from 'https://cdn.jsdelivr.net/npm/shiki@3.22.0/+esm'
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

const SUMMARY = "The codebase leans on two parallel generalization chains: a generic Hibernate DAO hierarchy (AbstractDao -> VwoDao -> per-entity DAOs, ~60 of them) and a Spring-Data-shaped repository facade that only pretends to be Spring Data (@NoRepositoryBean) and actually just forwards every call to a DAO. Controllers follow a third pattern: version-less interfaces hold the real logic as default methods, and thin v1/v2 classes just implement them. Solid double-line edges are 'extends', dashed edges are 'implements', plain arrows are 'uses/delegates'.";

const DIAGRAM = `graph TD
  subgraph daoLayerGroup["Generic DAO Layer"]
    abstractDao["&laquo;interface&raquo;<br/>AbstractDao&lt;E,K&gt;"]:::event
    abstractDaoImpl["AbstractDaoImpl&lt;E,K&gt;"]:::utility
    vwoDao["&laquo;interface&raquo;<br/>VwoDao&lt;E,K&gt;"]:::event
    vwoDaoImpl["VwoDaoImpl&lt;E,K&gt;"]:::utility
  end
  subgraph entityDaoGroup["Entity-Specific Persistence"]
    entityDao["&laquo;interface&raquo;<br/>PersoonDao"]:::event
    entityDaoImpl["PersoonDaoImpl"]:::utility
  end
  subgraph repoGroup["Repository Facade"]
    repositoryFacade["&laquo;interface&raquo;<br/>PersoonRepository<br/>&laquo;NoRepositoryBean&raquo;"]:::data
    repositoryFacadeImpl["PersoonRepositoryImpl"]:::data
  end
  subgraph apiSecGroup["API & Security"]
    sharedControllerInterface["&laquo;interface&raquo;<br/>SchoolController<br/>(version-less)"]:::component
    concreteController["SchoolController<br/>(v2 impl)"]:::component
    securityConfig["SecurityConfig<br/>extends WebSecurityConfigurerAdapter"]:::external
    tokenFilter["TokenAuthenticationFilter<br/>extends AbstractAuthenticationProcessingFilter"]:::external
  end

  abstractDaoImpl -.->|"implements"| abstractDao
  vwoDao ==>|"extends"| abstractDao
  vwoDaoImpl ==>|"extends"| abstractDaoImpl
  vwoDaoImpl -.->|"implements"| vwoDao
  entityDao ==>|"extends"| vwoDao
  entityDaoImpl ==>|"extends"| vwoDaoImpl
  entityDaoImpl -.->|"implements"| entityDao
  repositoryFacadeImpl -.->|"implements"| repositoryFacade
  repositoryFacadeImpl -->|"delegates to"| entityDaoImpl
  concreteController -.->|"implements"| sharedControllerInterface
  concreteController -->|"injects"| repositoryFacade
  tokenFilter -->|"registered by"| securityConfig
  securityConfig -->|"protects"| concreteController

  click abstractDao nodeClickHandler "View details"
  click abstractDaoImpl nodeClickHandler "View details"
  click vwoDao nodeClickHandler "View details"
  click vwoDaoImpl nodeClickHandler "View details"
  click entityDao nodeClickHandler "View details"
  click entityDaoImpl nodeClickHandler "View details"
  click repositoryFacade nodeClickHandler "View details"
  click repositoryFacadeImpl nodeClickHandler "View details"
  click sharedControllerInterface nodeClickHandler "View details"
  click concreteController nodeClickHandler "View details"
  click securityConfig nodeClickHandler "View details"
  click tokenFilter nodeClickHandler "View details"

  classDef component fill:#a855f7,stroke:#c084fc,color:#fff
  classDef composable fill:#7c3aed,stroke:#a78bfa,color:#fff
  classDef utility fill:#6d28d9,stroke:#8b5cf6,color:#fff
  classDef external fill:#525252,stroke:#737373,color:#fff
  classDef event fill:#d8b4fe,stroke:#e9d5ff,color:#000
  classDef data fill:#9333ea,stroke:#a855f7,color:#fff
`;

const NODES = {
  abstractDao: {
    title: "«interface» AbstractDao<E,K>",
    description: "Generic base CRUD contract — get/load/save/update/delete/merge — parameterized by entity type E and key type K. The root of the whole DAO hierarchy.",
    files: ["src/main/java/be/vwo/common/dao/AbstractDao.java"],
    code: `public interface AbstractDao<E, K extends Serializable> {
    E get(K key);
    E load(K key);
    void save(E entity);
    void update(E entity);
    void delete(E entity);
}`,
    lang: "java",
  },
  abstractDaoImpl: {
    title: "AbstractDaoImpl<E,K>",
    description: "Base implementation of AbstractDao using a raw Hibernate SessionFactory for get/load/persist/merge/save/update/delete — no Criteria API, no native SQL.",
    files: ["src/main/java/be/vwo/common/dao/impl/AbstractDaoImpl.java"],
    code: `public abstract class AbstractDaoImpl<E, K extends Serializable> implements AbstractDao<E, K> {
    protected SessionFactory factoryRW;
    protected SessionFactory factoryR;
}`,
    lang: "java",
  },
  vwoDao: {
    title: "«interface» VwoDao<E,K>",
    description: "Extends AbstractDao with an addAll() bulk-insert method. Nearly every entity-specific DAO interface in the project extends this instead of AbstractDao directly.",
    files: ["src/main/java/be/vwo/common/dao/VwoDao.java"],
    code: `public interface VwoDao<E, K extends Serializable> extends AbstractDao<E, K> {
    void addAll(Collection<E> entities);
}`,
    lang: "java",
  },
  vwoDaoImpl: {
    title: "VwoDaoImpl<E,K>",
    description: "Wires the two Hibernate SessionFactory beans (vwoRW read-write, vwoR read-only) via @Autowired setters and demarcates every inherited CRUD operation with @Transactional pointing at the matching transaction manager.",
    files: ["src/main/java/be/vwo/common/dao/impl/VwoDaoImpl.java"],
    code: `@Override
@Autowired
public void setFactoryRW(SessionFactory vwoRW) { super.setFactoryRW(vwoRW); }

@Override
@Transactional(value = transactionR, readOnly = true)
public E get(K key) { return super.get(key); }`,
    lang: "java",
  },
  entityDao: {
    title: "«interface» PersoonDao",
    description: "One such interface exists per entity/table — about 60 in total. Each extends VwoDao<Entity, KeyType> and adds domain-specific query methods on top of generic CRUD.",
    files: ["src/main/java/be/vwo/common/dao/PersoonDao.java"],
    code: `public interface PersoonDao extends VwoDao<Persoon, Short> {
    Persoon getPerson(String username);
}`,
    lang: "java",
  },
  entityDaoImpl: {
    title: "PersoonDaoImpl",
    description: "Concrete @Repository DAO extending VwoDaoImpl for generic CRUD and adding hand-written HQL for domain queries like a login lookup by email.",
    files: ["src/main/java/be/vwo/common/dao/impl/PersoonDaoImpl.java"],
    code: `@Repository
public class PersoonDaoImpl extends VwoDaoImpl<Persoon, Short> implements PersoonDao {
    @Transactional(value = transactionR, readOnly = true)
    public Persoon getPerson(String username) {
        Session session = getFactoryR().getCurrentSession();
        String hql = "SELECT p FROM Persoon p WHERE p.email = :email";
        return session.createQuery(hql, Persoon.class).setParameter("email", username).uniqueResult();
    }
}`,
    lang: "java",
  },
  repositoryFacade: {
    title: "«interface» PersoonRepository «NoRepositoryBean»",
    description: "Extends Spring Data's Repository<T,ID> marker interface purely for the familiar method-naming style (findByEmail, saveNewMember...). @NoRepositoryBean means Spring Data does NOT auto-implement it — this is naming convention only, not real Spring Data.",
    files: ["src/main/java/be/vwo/common/restAPI/repositories/PersoonRepository.java"],
    code: `@NoRepositoryBean
public interface PersoonRepository extends Repository<Persoon, Short> {
    Optional<Persoon> findByEmail(String email);
}`,
    lang: "java",
  },
  repositoryFacadeImpl: {
    title: "PersoonRepositoryImpl",
    description: "The hand-written @Repository bean that actually implements the facade interface, by constructor-injecting the matching entity DAO and forwarding every call to it — no query logic lives here.",
    files: ["src/main/java/be/vwo/common/restAPI/repositories/PersoonRepositoryImpl.java"],
    code: `@Repository
public class PersoonRepositoryImpl implements PersoonRepository {
    private final PersoonDao persoonDao;

    @Override
    public Optional<Persoon> findByEmail(String email) {
        return persoonDao.getPersonByMail(email);
    }
}`,
    lang: "java",
  },
  sharedControllerInterface: {
    title: "«interface» SchoolController (version-less)",
    description: "A plain Java interface — no @RestController — holding endpoint methods as default implementations plus an abstract getRepository() that concrete v1/v2 classes fulfill. This is where request handling and business logic actually live.",
    files: ["src/main/java/be/vwo/common/restAPI/controllers/SchoolController.java"],
    code: `public interface SchoolController {
    ScholenRepository getRepository();

    @GetMapping("/{id}")
    default ResponseEntity<Scholen> getById(@PathVariable("id") Short id) {
        return getRepository().findById(id)
                .map(ResponseEntity::ok).orElse(ResponseEntity.notFound().build());
    }
}`,
    lang: "java",
  },
  concreteController: {
    title: "SchoolController (v2 impl)",
    description: "The actual @RestController Spring registers. Its whole body is usually just an @Autowired constructor exposing the repository through a Lombok getter — every endpoint method is inherited unchanged from the interface.",
    files: ["src/main/java/be/vwo/common/restAPI/controllers/v2/SchoolController.java"],
    code: `@RestController
@RequestMapping(path = {V2Config.BASE_URL + "/school"})
public class SchoolController implements be.vwo.common.restAPI.controllers.SchoolController {
    @Getter(onMethod_ = {@Override})
    private final ScholenRepository repository;
}`,
    lang: "java",
  },
  securityConfig: {
    title: "SecurityConfig extends WebSecurityConfigurerAdapter",
    description: "Declares which URLs are public vs protected and registers TokenAuthenticationFilter into the filter chain ahead of AnonymousAuthenticationFilter. No sessions, no CSRF, no form login — purely stateless bearer-token auth.",
    files: ["src/main/java/be/vwo/common/security/SecurityConfig.java"],
    code: `http.sessionManagement().sessionCreationPolicy(STATELESS)
    .and().addFilterBefore(restAuthenticationFilter(), AnonymousAuthenticationFilter.class)
    .authorizeRequests().requestMatchers(PROTECTED_URLS).hasAnyAuthority("USER", "ADMIN")
    .anyRequest().authenticated();`,
    lang: "java",
  },
  tokenFilter: {
    title: "TokenAuthenticationFilter extends AbstractAuthenticationProcessingFilter",
    description: "Extracts the bearer token from each protected request and wraps it in a UsernamePasswordAuthenticationToken for Spring Security's AuthenticationManager to resolve.",
    files: ["src/main/java/be/vwo/common/security/TokenAuthenticationFilter.java"],
    code: `final String token = ofNullable(param)
        .map(value -> removeStart(value, BEARER))
        .map(String::trim)
        .orElseThrow(() -> new BadCredentialsException("Missing Authentication Token"));
final Authentication auth = new UsernamePasswordAuthenticationToken(token, token);
return getAuthenticationManager().authenticate(auth);`,
    lang: "java",
  },
};

const LEGEND = [
  { label: 'Interface', color: 'bg-node-event' },
  { label: 'Impl / Base Class', color: 'bg-node-utility' },
  { label: 'Facade (Data)', color: 'bg-node-data' },
  { label: 'Controller', color: 'bg-node-component' },
  { label: 'Framework / Security', color: 'bg-node-external' },
];

const langs = [...new Set(Object.values(NODES).map(n => n.lang).filter(Boolean))];
if (langs.length === 0) langs.push('typescript');
let highlighter = null;
try { highlighter = await createHighlighter({ themes: ['vitesse-dark'], langs }); }
catch (err) { console.warn('Shiki failed:', err); }
const HIGHLIGHTED = {};
for (const [id, node] of Object.entries(NODES)) {
  if (node.code && highlighter) {
    try { HIGHLIGHTED[id] = highlighter.codeToHtml(node.code, { lang: node.lang || 'typescript', theme: 'vitesse-dark' }); }
    catch (err) { console.warn(`Highlight failed for ${id}:`, err); }
  }
}

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current) canvasRef.current.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current?.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = svg.getBoundingClientRect().width / s.zoom;
    const sh = svg.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 80) / sw, (vh - 80) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (ev) => {
      ev.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top, s = st.current;
      const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (ev) => {
      if (ev.target.closest('.node')) return;
      drag.current = { on: true, lx: ev.clientX, ly: ev.clientY };
      vp.setPointerCapture(ev.pointerId);
    };
    const onMove = (ev) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += ev.clientX - d.lx; st.current.panY += ev.clientY - d.ly;
      d.lx = ev.clientX; d.ly = ev.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize({
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: {
        primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
        lineColor: '#a0a0a0', background: '#000000',
        secondaryColor: '#000000', tertiaryColor: '#000000',
        mainBkg: '#0a0a0a', nodeBorder: '#2a2a2a',
        clusterBkg: 'rgba(10,10,10,0.8)', clusterBorder: '#7c3aed',
        titleColor: '#ffffff', edgeLabelBackground: 'transparent',
      },
      flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
    });
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (ref.current) { ref.current.innerHTML = svg; bindFunctions?.(ref.current); }
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick]);
  return e('div', { ref, className: 'mermaid-wrap' });
}

function Summary({ collapsed, onToggle }) {
  if (collapsed) {
    return e('div', {
      onClick: onToggle,
      className: 'fixed top-16 left-6 z-10 px-3 py-1.5 bg-wt-surface/60 backdrop-blur border border-wt-border rounded-full shadow-lg cursor-pointer hover:bg-wt-surface/80 transition-all duration-300',
    }, e('span', { className: 'text-xs text-wt-muted font-medium' }, 'ℹ︎ Summary'));
  }
  return e('div', {
    onClick: onToggle,
    className: 'fixed top-16 left-6 z-10 max-w-lg px-4 py-3 bg-wt-surface/80 backdrop-blur border border-wt-border rounded-lg shadow-lg cursor-pointer transition-all duration-300',
  },
    e('p', { className: 'text-sm text-wt-muted leading-relaxed' }, SUMMARY),
    e('p', { className: 'text-[0.65rem] text-wt-muted/50 mt-1.5' }, 'Click to dismiss')
  );
}

function DetailPanel({ nodeId, node, onClose }) {
  useEffect(() => {
    const onKey = (ev) => { if (ev.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return e('div', { className: 'fixed top-4 right-4 bottom-4 w-[560px] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden' },
    e('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    e('div', { className: 'flex-1 overflow-y-auto p-5' },
      e('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      e('div', { className: 'dt-body' }, e('p', null, node.description)),
      node.code && e('div', { className: 'dt-body' },
        codeHtml
          ? e('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : e('pre', { className: 'code-fallback' }, e('code', null, node.code))
      ),
      node.files?.length > 0 && e('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        e('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
        e('code', { className: 'text-sm text-wt-file font-mono leading-relaxed' },
          node.files.map((f, i) => e('span', { key: i }, f, e('br')))
        )
      )
    )
  );
}

function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
  const btn = 'w-8 h-8 rounded-md border border-wt-border bg-wt-raised text-wt-fg flex items-center justify-center hover:bg-wt-accent/30 transition-colors text-sm';
  return e('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center gap-2 px-2 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
    e('button', { className: btn, onClick: onZoomOut }, '−'),
    e('span', { ref: zoomDisplayRef, className: 'text-xs text-wt-muted w-10 text-center' }, '100%'),
    e('button', { className: btn, onClick: onZoomIn }, '+'),
    e('button', { className: btn + ' w-auto px-2', onClick: onFit }, 'Fit')
  );
}

function App() {
  const [activeId, _setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    _setActiveId(nodeId);
    document.querySelectorAll('.mermaid-wrap .node').forEach(n => { n.style.opacity = nodeId ? '0.4' : '1'; });
    if (nodeId) {
      const el = document.querySelector(`.mermaid-wrap .node[id*="${nodeId}"]`);
      if (el) el.style.opacity = '1';
    }
  }, []);
  const closeDetail = useCallback(() => {
    _setActiveId(null);
    document.querySelectorAll('.mermaid-wrap .node').forEach(n => { n.style.opacity = '1'; });
  }, []);
  useEffect(() => { setTimeout(pz.fitToScreen, 600); }, [pz.fitToScreen]);

  return e(React.Fragment, null,
    e('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-wt-bg to-transparent pointer-events-none' },
      e('h1', { className: 'text-base font-semibold text-wt-fg' }, 'Architecture UML — VWO REST API'),
      e('p', { className: 'text-sm text-wt-muted mt-0.5' }, 'Key classes and interfaces: how the DAO, repository-facade, controller and security layers relate')
    ),
    e(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),
    e('div', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
      e('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[80px_60px_60px]' },
        e(MermaidDiagram, { onNodeClick: setActiveNode })
      )
    ),
    e(ZoomControls, { zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
    e('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
      LEGEND.map(l => e('span', { key: l.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted' },
        e('span', { className: `w-2 h-2 rounded-full ${l.color}` }), l.label
      ))
    ),
    activeId && NODES[activeId] && e(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }),
    e('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50' },
      e('kbd', null, 'Scroll'), ' zoom · ', e('kbd', null, 'Drag'), ' pan · Click nodes'
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
