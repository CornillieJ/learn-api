<body class="bg-wt-bg">
<div id="root"></div>
<script type="module">
import { createHighlighter } from 'https://cdn.jsdelivr.net/npm/shiki@3.22.0/+esm'
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

const SUMMARY = "This Spring Boot app (still packaged as a legacy WAR) gates every request behind a stateless JWT filter, routes it to a thin versioned controller that delegates to shared interface logic, and that logic calls a hand-written repository facade sitting on top of an older Hibernate DAO layer. The DAO layer talks to two Hibernate SessionFactories (read-write / read-only) wired from a legacy Spring XML file, with DB credentials swapped in at Maven build time rather than via a Spring profile.";

const DIAGRAM = `graph TD
  subgraph startup["Startup & Security"]
    bootstrap["App Bootstrap<br/>(OpenApiApplication)"]:::external
    securityFilter["JWT Security Filter"]:::event
    jwtService["JWT Token Service"]:::utility
  end
  subgraph apiLayer["API Layer"]
    versionedController["Versioned Controller<br/>(v1 / v2)"]:::component
    sharedLogic["Shared Controller Logic"]:::composable
  end
  subgraph persistence["Persistence"]
    repositoryFacade["Repository Facade"]:::data
    daoLayer["DAO Layer"]:::data
    hibernateConfig["Hibernate Session Config"]:::external
    environmentConfig["Environment Properties"]:::external
  end
  subgraph response["Response"]
    dtoModel["Response Model / DTO"]:::data
    jsonResponse["JSON HTTP Response"]:::event
  end

  bootstrap -.->|"wires"| securityFilter
  bootstrap -.->|"imports"| hibernateConfig
  securityFilter -->|"validates via"| jwtService
  securityFilter -->|"passes to"| versionedController
  versionedController -->|"implements"| sharedLogic
  sharedLogic -->|"calls"| repositoryFacade
  repositoryFacade -->|"delegates to"| daoLayer
  daoLayer -->|"uses"| hibernateConfig
  environmentConfig -.->|"feeds"| hibernateConfig
  sharedLogic -->|"returns"| dtoModel
  dtoModel -->|"serializes to"| jsonResponse

  click bootstrap nodeClickHandler "View details"
  click securityFilter nodeClickHandler "View details"
  click jwtService nodeClickHandler "View details"
  click versionedController nodeClickHandler "View details"
  click sharedLogic nodeClickHandler "View details"
  click repositoryFacade nodeClickHandler "View details"
  click daoLayer nodeClickHandler "View details"
  click hibernateConfig nodeClickHandler "View details"
  click environmentConfig nodeClickHandler "View details"
  click dtoModel nodeClickHandler "View details"
  click jsonResponse nodeClickHandler "View details"

  classDef component fill:#a855f7,stroke:#c084fc,color:#fff
  classDef composable fill:#7c3aed,stroke:#a78bfa,color:#fff
  classDef utility fill:#6d28d9,stroke:#8b5cf6,color:#fff
  classDef external fill:#525252,stroke:#737373,color:#fff
  classDef event fill:#d8b4fe,stroke:#e9d5ff,color:#000
  classDef data fill:#9333ea,stroke:#a855f7,color:#fff
`;

const NODES = {
  bootstrap: {
    title: "App Bootstrap (OpenApiApplication)",
    description: "Spring Boot's servlet initializer starts the whole app. It imports the legacy XML bean config and loads DB properties that were generated at Maven build time, not via a Spring profile.",
    files: ["src/main/java/be/vwo/common/restAPI/OpenApiApplication.java"],
    code: `@SpringBootApplication(exclude = {DataSourceAutoConfiguration.class}, scanBasePackages = "be.vwo.common")
@PropertySource("classpath:environment.properties")
@ImportResource("classpath:applicationContextAPI.xml")
public class OpenApiApplication extends SpringBootServletInitializer {`,
    lang: "java",
  },
  securityFilter: {
    title: "JWT Security Filter Chain",
    description: "Intercepts every request to a non-public URL, pulls the bearer token from the Authorization header or a t= query param, and kicks off Spring Security authentication before anything reaches a controller.",
    files: ["src/main/java/be/vwo/common/security/SecurityConfig.java", "src/main/java/be/vwo/common/security/TokenAuthenticationFilter.java"],
    code: `http.sessionManagement().sessionCreationPolicy(STATELESS)
    .and().addFilterBefore(restAuthenticationFilter(), AnonymousAuthenticationFilter.class)
    .authorizeRequests().requestMatchers(PROTECTED_URLS).hasAnyAuthority("USER", "ADMIN")
    .anyRequest().authenticated();`,
    lang: "java",
  },
  jwtService: {
    title: "JWT Token Service",
    description: "Mints a signed, expiring JWT on login (embedding the username claim) and verifies signature, issuer and expiry on every subsequent request, resolving the token back to a user.",
    files: ["src/main/java/be/vwo/common/security/jwt/JWTTokenService.java", "src/main/java/be/vwo/common/security/jwt/JwtAuthenticationService.java"],
    code: `public Map<String, String> verify(final String token) {
    final JwtParser parser = Jwts.parser()
            .requireIssuer(issuer)
            .setAllowedClockSkewSeconds(clockSkewSec)
            .setSigningKey(secretKey);
    return parseClaims(() -> parser.parseClaimsJws(token).getBody());
}`,
    lang: "java",
  },
  versionedController: {
    title: "Versioned Controller (v1 / v2)",
    description: "A thin @RestController per API version that just wires its repository dependency. v1 exposes the old /restapi paths for legacy clients; v2 exposes only the clean /api/v2 surface.",
    files: ["src/main/java/be/vwo/common/restAPI/controllers/v2/SchoolController.java"],
    code: `@RestController
@RequestMapping(path = {V2Config.BASE_URL + "/school"})
public class SchoolController implements be.vwo.common.restAPI.controllers.SchoolController {
    @Getter(onMethod_ = {@Override})
    private final ScholenRepository repository;
}`,
    lang: "java",
  },
  sharedLogic: {
    title: "Shared Controller Logic (interface)",
    description: "A version-less Java interface holding the real endpoint logic as default methods. New endpoints get added here once and are inherited by both v1 and v2 automatically.",
    files: ["src/main/java/be/vwo/common/restAPI/controllers/KangoeroeParticipantsController.java"],
    code: `default ResponseEntity<List<SchoolPrizeCount>> getSchoolPrizeCounts(...) {
    Map<Short, Long> counts = getKangoeroeRepository().countPrimusWinnersPerSchool(edition, year);
    ...
}`,
    lang: "java",
  },
  repositoryFacade: {
    title: "Repository Facade",
    description: "Looks like a Spring Data repository (extends Repository<T,ID>) but is @NoRepositoryBean, so nothing gets auto-implemented. It's a hand-written class that just delegates every call to the older DAO layer.",
    files: ["src/main/java/be/vwo/common/restAPI/repositories/LeerlingKangoeroeRepositoryImpl.java"],
    code: `@Repository
public class LeerlingKangoeroeRepositoryImpl implements LeerlingKangoeroeRepository {
    private final LeerlingKangoeroeDao dao;
    public List<LeerlingKangoeroe> findAllById(Iterable<Integer> iterable) {
        return dao.getAllById(IterableUtils.toList(iterable));
    }
}`,
    lang: "java",
  },
  daoLayer: {
    title: "DAO Layer (AbstractDao / VwoDao)",
    description: "About 60 entity-specific DAOs extend a generic AbstractDao/VwoDao base for CRUD, adding hand-written HQL for anything custom. Each method is explicitly transactional against a chosen SessionFactory.",
    files: ["src/main/java/be/vwo/common/dao/impl/VwoDaoImpl.java", "src/main/java/be/vwo/common/dao/impl/PersoonDaoImpl.java"],
    code: `@Repository
public class PersoonDaoImpl extends VwoDaoImpl<Persoon, Short> implements PersoonDao {
    @Transactional(value = transactionR, readOnly = true)
    public Persoon getPerson(String username) {
        Session session = getFactoryR().getCurrentSession();
        ...
    }
}`,
    lang: "java",
  },
  hibernateConfig: {
    title: "Hibernate Session Config (legacy XML)",
    description: "Declares two Hibernate SessionFactories against the same database — one read-write, one read-only — each paired with its own transaction manager that DAO methods pick between via @Transactional.",
    files: ["src/main/resources/applicationContextAPI.xml", "src/main/resources/hibernate_VWO.cfg.xml"],
    code: `<bean id="vwoRW" class="org.springframework.orm.hibernate5.LocalSessionFactoryBean">
    <property name="configLocation" value="classpath:hibernate_VWO.cfg.xml"/>
    <property name="hibernateProperties">
        <props>
            <prop key="hibernate.connection.username">\${database.VWO.readWrite.username}</prop>
        </props>
    </property>
</bean>`,
    lang: "xml",
  },
  environmentConfig: {
    title: "Environment Properties (dev vs prod)",
    description: "DB credentials and other env-specific values. A Maven profile runs an Ant task that copies either the dev or prod properties file into environment.properties at build time — this is a build-time file swap, not a Spring profile.",
    files: ["src/main/resources/environmentAPI.dev.properties", "src/main/resources/environmentAPI.prod.properties", "ant.xml"],
    code: `<target name="properties-APIdev">
    <copy-properties file="environmentAPI.dev"/>
</target>
<target name="properties-APIprod">
    <copy-properties file="environmentAPI.prod"/>
</target>`,
    lang: "xml",
  },
  dtoModel: {
    title: "Response Model / DTO",
    description: "Immutable Java records shaped purely for JSON output, annotated with Jackson and Swagger. Deliberately decoupled from the JPA entities in dbEntities that model the actual database.",
    files: ["src/main/java/be/vwo/common/restAPI/models/PoolPupilAnswers.java"],
    code: `public record PoolPupilAnswers(
        @JsonProperty(index = 0, required = true) int personId,
        @JsonProperty(index = 1, required = true) List<AnswerPair> answers
) {}`,
    lang: "java",
  },
  jsonResponse: {
    title: "JSON HTTP Response",
    description: "Spring wraps the returned DTO or entity in the ResponseEntity handed back by the shared interface method, and Jackson serializes it to JSON for the client.",
    files: ["src/main/java/be/vwo/common/restAPI/controllers/SchoolController.java"],
    code: `default ResponseEntity<Scholen> getById(@PathVariable("id") Short id) {
    return getRepository().findById(id)
            .map(person -> ResponseEntity.ok().body(person)).orElse(ResponseEntity.notFound().build());
}`,
    lang: "java",
  },
};

const LEGEND = [
  { label: 'Controller', color: 'bg-node-component' },
  { label: 'Interface / Logic', color: 'bg-node-composable' },
  { label: 'DAO / Impl', color: 'bg-node-utility' },
  { label: 'Framework / Config', color: 'bg-node-external' },
  { label: 'Request / Response', color: 'bg-node-event' },
  { label: 'Data / DTO', color: 'bg-node-data' },
];

const langs = [...new Set(Object.values(NODES).map(n => n.lang).filter(Boolean))];
if (langs.length === 0) langs.push('typescript');
let highlighter = null;
try { highlighter = await createHighlighter({ themes: ['vitesse-dark'], langs }); }
catch (err) { console.warn('Shiki failed:', err); }
const HIGHLIGHTED = {};
for (const [id, node] of Object.entries(NODES)) {
  if (node.code && highlighter) {
    try { HIGHLIGHTED[id] = highlighter.codeToHtml(node.code, { lang: node.lang || 'typescript', theme: 'vitesse-dark' }); }
    catch (err) { console.warn(`Highlight failed for ${id}:`, err); }
  }
}

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current) canvasRef.current.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current?.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = svg.getBoundingClientRect().width / s.zoom;
    const sh = svg.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 80) / sw, (vh - 80) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (ev) => {
      ev.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top, s = st.current;
      const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (ev) => {
      if (ev.target.closest('.node')) return;
      drag.current = { on: true, lx: ev.clientX, ly: ev.clientY };
      vp.setPointerCapture(ev.pointerId);
    };
    const onMove = (ev) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += ev.clientX - d.lx; st.current.panY += ev.clientY - d.ly;
      d.lx = ev.clientX; d.ly = ev.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize({
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: {
        primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
        lineColor: '#a0a0a0', background: '#000000',
        secondaryColor: '#000000', tertiaryColor: '#000000',
        mainBkg: '#0a0a0a', nodeBorder: '#2a2a2a',
        clusterBkg: 'rgba(10,10,10,0.8)', clusterBorder: '#7c3aed',
        titleColor: '#ffffff', edgeLabelBackground: 'transparent',
      },
      flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
    });
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (ref.current) { ref.current.innerHTML = svg; bindFunctions?.(ref.current); }
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick]);
  return e('div', { ref, className: 'mermaid-wrap' });
}

function Summary({ collapsed, onToggle }) {
  if (collapsed) {
    return e('div', {
      onClick: onToggle,
      className: 'fixed top-16 left-6 z-10 px-3 py-1.5 bg-wt-surface/60 backdrop-blur border border-wt-border rounded-full shadow-lg cursor-pointer hover:bg-wt-surface/80 transition-all duration-300',
    }, e('span', { className: 'text-xs text-wt-muted font-medium' }, 'ℹ︎ Summary'));
  }
  return e('div', {
    onClick: onToggle,
    className: 'fixed top-16 left-6 z-10 max-w-lg px-4 py-3 bg-wt-surface/80 backdrop-blur border border-wt-border rounded-lg shadow-lg cursor-pointer transition-all duration-300',
  },
    e('p', { className: 'text-sm text-wt-muted leading-relaxed' }, SUMMARY),
    e('p', { className: 'text-[0.65rem] text-wt-muted/50 mt-1.5' }, 'Click to dismiss')
  );
}

function DetailPanel({ nodeId, node, onClose }) {
  useEffect(() => {
    const onKey = (ev) => { if (ev.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return e('div', { className: 'fixed top-4 right-4 bottom-4 w-[560px] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden' },
    e('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    e('div', { className: 'flex-1 overflow-y-auto p-5' },
      e('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      e('div', { className: 'dt-body' }, e('p', null, node.description)),
      node.code && e('div', { className: 'dt-body' },
        codeHtml
          ? e('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : e('pre', { className: 'code-fallback' }, e('code', null, node.code))
      ),
      node.files?.length > 0 && e('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        e('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
        e('code', { className: 'text-sm text-wt-file font-mono leading-relaxed' },
          node.files.map((f, i) => e('span', { key: i }, f, e('br')))
        )
      )
    )
  );
}

function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
  const btn = 'w-8 h-8 rounded-md border border-wt-border bg-wt-raised text-wt-fg flex items-center justify-center hover:bg-wt-accent/30 transition-colors text-sm';
  return e('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center gap-2 px-2 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
    e('button', { className: btn, onClick: onZoomOut }, '−'),
    e('span', { ref: zoomDisplayRef, className: 'text-xs text-wt-muted w-10 text-center' }, '100%'),
    e('button', { className: btn, onClick: onZoomIn }, '+'),
    e('button', { className: btn + ' w-auto px-2', onClick: onFit }, 'Fit')
  );
}

function App() {
  const [activeId, _setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    _setActiveId(nodeId);
    document.querySelectorAll('.mermaid-wrap .node').forEach(n => { n.style.opacity = nodeId ? '0.4' : '1'; });
    if (nodeId) {
      const el = document.querySelector(`.mermaid-wrap .node[id*="${nodeId}"]`);
      if (el) el.style.opacity = '1';
    }
  }, []);
  const closeDetail = useCallback(() => {
    _setActiveId(null);
    document.querySelectorAll('.mermaid-wrap .node').forEach(n => { n.style.opacity = '1'; });
  }, []);
  useEffect(() => { setTimeout(pz.fitToScreen, 600); }, [pz.fitToScreen]);

  return e(React.Fragment, null,
    e('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-wt-bg to-transparent pointer-events-none' },
      e('h1', { className: 'text-base font-semibold text-wt-fg' }, 'Code Flow — VWO REST API'),
      e('p', { className: 'text-sm text-wt-muted mt-0.5' }, 'How a request travels from the client to the database and back')
    ),
    e(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),
    e('div', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
      e('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[80px_60px_60px]' },
        e(MermaidDiagram, { onNodeClick: setActiveNode })
      )
    ),
    e(ZoomControls, { zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
    e('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
      LEGEND.map(l => e('span', { key: l.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted' },
        e('span', { className: `w-2 h-2 rounded-full ${l.color}` }), l.label
      ))
    ),
    activeId && NODES[activeId] && e(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }),
    e('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50' },
      e('kbd', null, 'Scroll'), ' zoom · ', e('kbd', null, 'Drag'), ' pan · Click nodes'
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
