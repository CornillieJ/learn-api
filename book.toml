[book]
title = "Learning Java for the VWO API"
authors = ["Jeffrey Cornillie"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
site-url = "/learn-api/"
git-repository-url = "https://github.com/CornillieJ/learn-api"
additional-css = ["theme/custom.css", "theme/interactive.css"]
additional-js = [
    "theme/book-config.js",
    "theme/celebrate.js",
    "theme/levels.js",
    "theme/checkmarks.js",
    "theme/on-this-page.js",
    "theme/quiz.js",
    "theme/flashcards.js",
    "theme/code-compare.js",
    "theme/progress-map.js",
    "theme/pace-chooser.js",
    "theme/layer-explorer.js",
    "theme/code-walk.js",
    "theme/mermaid-diagram.js",
    "theme/diff-view.js",
    "theme/compat-matrix.js",
    "theme/timeline.js",
    "theme/copy-as.js",
    "theme/scenario.js",
    "theme/glossary.js",
    "theme/ref-tree.js",
    "theme/fill-in.js",
    "theme/command-palette.js",
    "theme/decision-table.js",
    "theme/before-after.js",
    "theme/footnote.js",
    "theme/page-feedback.js",
    "theme/heading-link.js",
    "theme/param-table.js",
    "theme/reading-time.js",
]
